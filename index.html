<!--
//
// HpbVfx — layer fly-in, DVD-ROM style.
// Constant-step slides on a 50ms timer, clip-wipe on a 100ms timer,
// all layers released together after a 1000ms first delay.
//
var FRAMES = 40;

function vfxSlide(id, fromX, fromY, tick) {
  var el = document.getElementById(id);
  var endX = el.offsetLeft, endY = el.offsetTop;
  var stepX = (endX - fromX) / FRAMES, stepY = (endY - fromY) / FRAMES;
  if (stepX > 0 && stepX < 1) stepX = 1;  if (stepX < 0 && stepX > -1) stepX = -1;
  if (stepY > 0 && stepY < 1) stepY = 1;  if (stepY < 0 && stepY > -1) stepY = -1;
  var x = fromX, y = fromY;
  el.style.left = Math.round(x) + "px";
  el.style.top  = Math.round(y) + "px";
  el.style.visibility = "visible";
  function step() {
    x += stepX;  y += stepY;
    var doneX = (stepX === 0) || (stepX > 0 && x >= endX) || (stepX < 0 && x <= endX);
    var doneY = (stepY === 0) || (stepY > 0 && y >= endY) || (stepY < 0 && y <= endY);
    if (doneX) x = endX;
    if (doneY) y = endY;
    el.style.left = Math.round(x) + "px";
    el.style.top  = Math.round(y) + "px";
    if (!(doneX && doneY)) setTimeout(step, tick);
  }
  setTimeout(step, tick);
}

function vfxWipe(id, tick) {
  var el = document.getElementById(id);
  var w = el.offsetWidth, c = 0;
  el.style.clipPath = "inset(0 " + w + "px 0 0)";
  el.style.visibility = "visible";
  function step() {
    c += 4;
    if (c >= w) { el.style.clipPath = "inset(0 0 0 0)"; return; }
    el.style.clipPath = "inset(0 " + (w - c) + "px 0 0)";
    setTimeout(step, tick);
  }
  setTimeout(step, tick);
}

function vfxSpiral(id, radius, revs, tick) {
  /* HpbVfx0301 pattern "I": orbit the resting position on a shrinking
     radius until it locks — the disc's own spiral-in, choppy steps and all */
  var el = document.getElementById(id);
  var endX = el.offsetLeft, endY = el.offsetTop;
  var r = radius, a = -Math.PI / 2;
  var stepA = (Math.PI * 2 * revs) / 40;
  function step() {
    r *= 0.9;  a += stepA;
    if (r < 2) {
      el.style.left = endX + "px";
      el.style.top  = endY + "px";
      return;
    }
    el.style.left = Math.round(endX + Math.cos(a) * r) + "px";
    el.style.top  = Math.round(endY + Math.sin(a) * r) + "px";
    setTimeout(step, tick);
  }
  el.style.left = Math.round(endX + Math.cos(a) * r) + "px";
  el.style.top  = Math.round(endY + Math.sin(a) * r) + "px";
  el.style.visibility = "visible";
  setTimeout(step, tick);
}

function HpbVfxinit() {
  setTimeout(function () {
    vfxSlide("Layer1", -420,  130, 50);   /* A130: in from the left  */
    vfxSlide("Layer2", -160,  600, 50);   /* A830: in from bottom-left */
    vfxSlide("Layer3",   68, -60,  50);   /* A330: in from the top   */
    vfxSlide("Layer4", -320, -60,  50);   /* A530: in from top-left  */
    vfxWipe ("Layer5", 100);              /* D120: wipe reveal       */
  }, 1000);
  setTimeout(function () {
    vfxSpiral("Layer7", 170, 2.5, 50);    /* I-pattern: tagline spiral-in */
  }, 1900);
}

function fitStage() {
  var s = Math.min(window.innerWidth / 800, window.innerHeight / 600);
  document.getElementById("stage").style.transform = "scale(" + s + ")";
}
//-->
